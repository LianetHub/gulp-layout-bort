<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Проверка UI-кита</title><link rel="stylesheet" href="../docs/css/reset.css"><link rel="stylesheet" href="../docs/css/style.css"></head>
<body>
<main class="ui-test" style="padding:24px;max-width:1000px;margin:auto">
    <h1 class="ui-test__title title">Проверка UI-кита</h1>
    <p class="ui-test__status" id="status" role="status">RUNNING</p>
    <ol class="ui-test__results" id="results"></ol>
    <form class="form ui-test__form" id="fixture" style="display:grid;gap:20px;margin-top:20px">
        <label class="form__field"><span class="form__label">Город</span><select class="form__control" name="city" id="city" data-custom-select data-has-search required><option value="">Выберите город</option><optgroup label="Города"><option value="orel">Орёл</option><option value="moscow">Москва</option><option value="tula" disabled>Тула</option></optgroup><optgroup label="Скрытые"><option value="hidden" hidden>Орёл скрытый</option></optgroup></select></label>
        <select class="ui-test__select" name="status" id="multi" aria-label="Статус заказа" data-custom-select data-select-chip multiple><option value="processing" selected>В обработке</option><option value="paid">Оплачен</option><optgroup label="Недоступные" disabled><option value="cancelled">Отменён</option></optgroup></select>
        <div class="ui-test__buttons" style="display:flex;gap:12px;flex-wrap:wrap"><button type="button" class="btn btn-primary">В корзину</button><button type="button" class="btn btn-secondary">Показать ещё</button><button type="button" class="btn btn-primary" disabled>Недоступно</button><button type="button" class="btn btn-outline">Заказать звонок</button></div>
        <input class="form__control" placeholder="Имя"><input class="form__control" placeholder="Disabled" disabled><input class="form__control _error" placeholder="Ошибка" aria-invalid="true">
        <div class="search-field"><input class="search-field__input" placeholder="Поиск по сайту"><button type="button" class="search-field__button icon-search" aria-label="Искать"></button></div>
        <button type="reset" class="btn btn-secondary">Сбросить форму</button>
    </form>
    <div class="ui-test__badges" style="display:flex;gap:5px;margin-top:20px"><span class="badge badge--orange icon-like">Лидер продаж</span><span class="badge badge--yellow icon-hot-price">Акция</span><span class="badge badge--green icon-star">Новинка</span></div>
    <div class="ui-test__tooltip" style="margin-top:20px">Мощность <span class="tooltip"><button type="button" class="tooltip__trigger icon-information-circle" aria-label="Подробнее о мощности" aria-describedby="power-help"></button><span class="tooltip__content" role="tooltip" id="power-help"><span class="tooltip__text">Максимальная мощность устройства при подключённой нагрузке.</span></span></span></div>
</main>
<div class="ui-test__preview" style="max-width:100%;overflow:auto"><iframe class="ui-test__frame" id="preview" title="Проверка страниц" style="height:900px;border:0"></iframe></div>
<script type="module" src="ui-kit-browser.js"></script>
</body></html>

<header class="header">
    <div class="header__content">
        <div class="container header__content-container">
            <a href="index.html" class="header__logo">
                <img src="@img/logo-compact.svg" width="138" height="40" alt="Логотип сайта Bort" class="header__image">
            </a>
            <button type="button" class="header__burger icon-menu-alternate" aria-label="Открыть меню" aria-expanded="false" aria-controls="header-menu"></button>
            <a href="catalog.html" class="header__catalog btn btn-dark" aria-label="Каталог" aria-controls="mobile-catalog" aria-expanded="false">
                <span class="header__catalog-icon icon-menu" aria-hidden="true"></span>
                <span class="header__catalog-icon header__catalog-icon--grid icon-dots-grid" aria-hidden="true"></span>
                <span class="header__catalog-text">Каталог</span>
            </a>
            <a href="tel:+74997057979" aria-label="Позвонить" class="header__phone header__phone--mobile icon-phone"></a>
            @@include('./includes/_search.html')
            <nav class="header__actions main-actions" aria-label="Основная навигация">
                <a href="catalog.html" class="main-actions__item icon-dots-grid" aria-label="Каталог" aria-controls="mobile-catalog" aria-expanded="false">
                    <span class="main-actions__item-text">
                        Каталог
                    </span>
                </a>
                <a href="cart.html" class="main-actions__item icon-cart" aria-label="Корзина">
                    <span class="main-actions__item-text">
                        Корзина
                    </span>
                    <span class="main-actions__quanitity">9999</span>
                </a>
                <a href="favorite.html" class="main-actions__item icon-heart" aria-label="Избранное">
                    <span class="main-actions__item-text">
                        Избранное
                    </span>
                </a>
                <a href="compare.html" class="main-actions__item icon-bars" aria-label="Сравнение">
                    <span class="main-actions__item-text">
                        Сравнение
                    </span>
                </a>
                <a href="#sign-in" data-auth-open class="main-actions__item icon-user-circle" aria-label="Войти" aria-haspopup="dialog">
                    <span class="main-actions__item-text">
                        Войти
                    </span>
                </a>
            </nav>
        </div>
    </div>
    <button type="button" class="header__backdrop" aria-label="Закрыть меню" tabindex="-1" hidden></button>
    <div class="header__bottom" id="header-menu">
        <div class="header__bottom-container container">
            <nav aria-label="Меню в шапке" class="header__menu menu">
                <ul class="menu__list">
                    <li class="menu__item">
                        <a href="catalog.html" class="menu__link icon-sale">Акция</a>
                    </li>
                    <li class="menu__item">
                        <a href="" class="menu__link">Бытовая техника</a>
                    </li>
                    <li class="menu__item">
                        <a href="" class="menu__link">Клининг</a>
                    </li>
                    <li class="menu__item">
                        <a href="" class="menu__link">Инструмент</a>
                    </li>
                    <li class="menu__item">
                        <a href="" class="menu__link">Для сада</a>
                    </li>
                    <li class="menu__item">
                        <a href="" class="menu__link">Horeca</a>
                    </li>
                    <li class="menu__item">
                        <a href="" class="menu__link">Расширенная гарантия</a>
                    </li>
                </ul>
            </nav>
            <div class="header__delivery">
                Адрес доставки: <address class="header__address">ул. Авиационная, д.10</address>
            </div>
        </div>
    </div>
    @@include('./includes/_mobile-catalog.html')
</header>

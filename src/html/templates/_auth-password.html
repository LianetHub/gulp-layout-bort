<div class="auth-dialog__field">
    <label class="auth-dialog__label" for="@@id">Пароль</label>
    <div class="auth-dialog__password">
        <input class="auth-dialog__input auth-dialog__input--password" id="@@id" type="password" name="password" autocomplete="@@autocomplete" required>
        <button class="auth-dialog__eye" type="button" aria-label="Показать пароль" aria-pressed="false" data-auth-password><span class="auth-dialog__eye-icon icon-eye" aria-hidden="true"></span></button>
    </div>
    <span class="auth-dialog__error"></span>
</div>

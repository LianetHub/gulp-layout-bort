<div class="form__field auth-dialog__field">
    <label class="auth-dialog__label" for="@@id">Пароль</label>
    <div class="auth-dialog__password">
        <input class="auth-dialog__input auth-dialog__input--password" id="@@id" type="password" name="password" autocomplete="@@autocomplete" required data-required>
        <button class="auth-dialog__eye" type="button" aria-label="Показать пароль" aria-pressed="false" data-auth-password data-password-show-label="Показать пароль" data-password-hide-label="Скрыть пароль">
            <span class="auth-dialog__eye-icon icon-eye" aria-hidden="true"></span>
        </button>
    </div>
    <span class="form__error-message auth-dialog__error" hidden aria-live="polite">Поле обязательно для заполнения</span>
</div>

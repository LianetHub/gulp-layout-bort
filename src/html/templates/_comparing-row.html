    <div class="comparing__values"><span class="comparing__value">@@first</span><span class="comparing__value">@@second</span><span class="comparing__value">@@third</span><span class="comparing__value">@@first</span><span class="comparing__value">@@second</span><span class="comparing__value">@@third</span></div>
</div>

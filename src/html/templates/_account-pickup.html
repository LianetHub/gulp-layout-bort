<div class="addresses__card" data-pickup-card>
    <label class="addresses__choice"><input class="addresses__radio" type="radio" name="account-default-pickup" value="@@id" @@checked>
        <span class="addresses__text"><span class="addresses__pickup-heading"><span class="addresses__name">@@title</span><img class="addresses__brand" src="@img/pickup/ozon.svg" width="46" height="20" alt="Ozon"></span><span class="addresses__details">Пн-Вс: @@hours • Срок хранения: 5 дней</span></span>
    </label>
    <div class="addresses__actions"><button class="addresses__edit" type="button" aria-label="Изменить пункт выдачи"><span class="addresses__icon icon-edit" aria-hidden="true"></span></button><button class="addresses__delete" type="button" aria-label="Удалить пункт выдачи"><span class="addresses__icon icon-trash" aria-hidden="true"></span></button></div>
</div>

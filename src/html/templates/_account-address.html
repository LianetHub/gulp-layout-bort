<div class="addresses__card" data-address-card>
    <label class="addresses__choice">
        <input class="addresses__radio" type="radio" name="default-address" value="@@id" data-city="@@city" data-street="@@street" data-entrance="@@entrance" data-floor="@@floor" data-apartment="@@apartment" data-comment="" @@checked>
        <span class="addresses__text"><span class="addresses__name">@@city, @@street</span><span class="addresses__details">@@details</span></span>
    </label>
    <div class="addresses__actions">
        <button class="addresses__edit" type="button" aria-label="Редактировать адрес"><img class="addresses__icon" src="@img/addresses/edit.svg" width="24" height="24" alt=""></button>
        <button class="addresses__delete" type="button" aria-label="Удалить адрес"><img class="addresses__icon" src="@img/addresses/trash.svg" width="24" height="24" alt=""></button>
    </div>
</div>

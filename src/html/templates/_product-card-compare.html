<div class="comparing__item swiper-slide" data-compare-id="@@id">
    <article class="product comparing-card">
        <div class="comparing-card__header">
            <a href="product.html" class="comparing-card__image" aria-label="@@name"><img src="@@image" alt="@@name" class="comparing-card__picture" width="180" height="180"></a>
            <div class="comparing-card__actions">
                <button type="button" class="comparing-card__action" data-compare-remove aria-label="Удалить @@name из сравнения"><img src="@img/comparing/trash.svg" alt="" class="comparing-card__icon" width="17" height="18"></button>
                <button type="button" class="comparing-card__action favorite-btn" aria-pressed="false" aria-label="Добавить @@name в избранное"><img src="@img/comparing/heart.svg" alt="" class="comparing-card__icon" width="17" height="16"></button>
            </div>
        </div>
        <a href="product.html" class="product__name comparing-card__name">@@name</a>
        <div class="comparing-card__bottom">
            <div class="comparing-card__price"><strong class="comparing-card__current">@@currentPrice</strong>@@if(oldPrice){<del class="comparing-card__old">@@oldPrice</del>}</div>
            <button type="button" class="comparing-card__cart add-to-cart-btn" aria-label="Добавить @@name в корзину"><span class="comparing-card__cart-text">В корзину</span><img src="@img/comparing/cart.svg" alt="" class="comparing-card__cart-icon" width="20" height="20"></button>
        </div>
    </article>
</div>

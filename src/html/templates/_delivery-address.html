<label class="address-picker__card">
    <input class="address-picker__radio" type="radio" name="saved_address" value="@@id" data-city="@@city" data-street="@@street" data-apartment="@@apartment" data-entrance="@@entrance" data-floor="@@floor" @@if (checked) {checked}>
    <span class="address-picker__card-body">
        <span class="address-picker__indicator icon-checkmark-circle" aria-hidden="true"></span>
        <span class="address-picker__card-content">
            <span class="address-picker__card-title">@@city, @@street</span>
            <span class="address-picker__card-details">@@details</span>
        </span>
    </span>
</label>

<div class="promo-card swiper-slide" style="background-image: url('@@url');">
    <div class="promo-card__label">@@label</div>
    <@@heading class="promo-card__title title title--promo"><a href="product.html" class="promo-card__link">@@title</a></@@heading>
    <p class="promo-card__description">@@desc</p>
    <ul class="promo-card__list">@@features</ul>
    <a href="product.html" class="promo-card__btn btn btn-secondary btn--small">Подробнее</a>
</div>

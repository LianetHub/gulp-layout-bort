<details class="faq__item" @@if(opened){ open}>
    <summary class="faq__question">
        <span class="faq__question-text">@@question</span>
        <span class="faq__arrow icon-chevron-down" aria-hidden="true"></span>
    </summary>
    <div class="faq__answer">
        <p class="faq__answer-text text-body text-body--small">@@answer</p>
    </div>
</details>

<label class="address-picker__card address-picker__card--pickup">
    <input class="address-picker__radio" type="radio" name="pickup_point_choice" value="@@id" data-address="@@address" data-hours="Ежедневно, 09:00-22:00" @@if (checked) {checked}>
    <span class="address-picker__card-body">
        <span class="address-picker__card-content">
            <span class="address-picker__card-title">@@address</span>
            <span class="address-picker__card-details">Срок хранения заказа - 14 дней</span>
            <span class="address-picker__availability">Адрес подходит для этих товаров</span>
        </span>
    </span>
</label>

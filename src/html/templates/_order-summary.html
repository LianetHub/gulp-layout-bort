<article class="order-summary" data-status="@@status" data-payment="@@payment">
    <div class="order-summary__heading">
        <div class="order-summary__info">
            <h3 class="order-summary__title title title-sm">Заказ №2504-477215<span class="order-summary__suffix">-77804</span>
            </h3>
            <p class="order-summary__date">от 12 мая 2026 в 13:49</p>
            <div class="order-summary__tags">
                <span class="order-summary__tag order-summary__tag--@@status">
                    <span class="order-summary__desktop">@@statusText</span>
                    <span class="order-summary__mobile">В обработке</span>
                </span>
                <span class="order-summary__tag order-summary__tag--@@payment">
                    <span class="order-summary__desktop">@@paymentText</span>
                    <span class="order-summary__mobile">@@mobilePayment</span>
                </span>
            </div>
        </div>
        <p class="order-summary__price">
            <span class="order-summary__desktop">@@price</span>
            <span class="order-summary__mobile">27 435</span> ₽
        </p>
    </div>
    <div class="order-summary__products">
        <img class="order-summary__image" src="@img/goods/disposer-1.png" width="60" height="60" alt="Измельчитель пищевых отходов Bort">
        <img class="order-summary__image order-summary__image--additional" src="@img/goods/titan-5000-02.png" width="60" height="60" alt="Измельчитель пищевых отходов Bort, вторая модель">
        <span class="order-summary__more">+1</span>
    </div>
    <a class="order-summary__button btn" href="lk-order.html">Подробнее о заказе</a>
</article>

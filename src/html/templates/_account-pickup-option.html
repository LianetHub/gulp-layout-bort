<button class="pickup-dialog__point" type="button" data-pickup-id="@@id" data-address="@@address" data-hours="@@hours" data-coords="@@latitude,@@longitude">
    <span class="pickup-dialog__radio" aria-hidden="true"></span>
    <span class="pickup-dialog__point-text">
        <span class="pickup-dialog__point-title">@@title</span>
        <span class="pickup-dialog__point-meta">@@distance • Пн-Вс: @@hours</span>
    </span>
    <span class="pickup-dialog__point-data" hidden>
        <span class="pickup-dialog__point-detail-title" data-pickup-detail-title>Пункт Ozon №@@id</span>
        <span class="pickup-dialog__point-detail-hours" data-pickup-detail-hours>Пн-Вс @@hours (без перерыва)</span>
        <span class="pickup-dialog__point-summary" data-pickup-summary>Пн-Вс: @@hours • Срок хранения: 5 дней</span>
    </span>
</button>

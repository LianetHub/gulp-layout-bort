<li class="order-product">
    <a class="order-product__image-link" href="product.html">
        <img class="order-product__image" src="@@image" width="70" height="70" alt="@@name">
    </a>
    <div class="order-product__content">
        <p class="order-product__sku">Артикул: 91275783</p>
        <a class="order-product__name" href="product.html">@@name</a>
    </div>
    <div class="order-product__price">
        <p class="order-product__amount">@@price ₽</p>
        <p class="order-product__quantity">1 шт.</p>
    </div>
    <button class="order-product__favorite favorite-btn icon-heart" type="button" aria-label="Добавить в избранное: @@name" aria-pressed="false"></button>
</li>

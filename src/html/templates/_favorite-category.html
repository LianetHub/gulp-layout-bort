<div class="favorites__category">
    <button type="button" class="favorites__filter" aria-pressed="false">@@name <span class="favorites__count">@@count</span>
    </button>
    <button type="button" class="favorites__remove" data-remove-category="@@id" aria-label="Удалить категорию «@@name» из избранного">
        <span class="favorites__remove-icon icon-close" aria-hidden="true"></span>
    </button>
</div>

<div class="favorites__category">
    <button type="button" class="favorites__filter" aria-pressed="false">@@name <span class="favorites__count">@@count</span></button>
    <button type="button" class="favorites__remove" data-remove-category="@@id" aria-label="Удалить категорию «@@name» из избранного"><img src="@img/favorites/category-close.svg" alt="" class="favorites__remove-icon" width="16" height="16"></button>
</div>

<article class="contractor-card">
    <h4 class="contractor-card__name title title--benefit">@@name</h4>
    <div class="contractor-card__contacts">
        <p class="contractor-card__row"><span class="contractor-card__label">Email:</span><a class="contractor-card__link" href="mailto:@@email">@@email</a></p>
        <div class="contractor-card__contact">
            <p class="contractor-card__label">Телефон:</p>
            <div class="contractor-card__values">
                <a class="contractor-card__link" href="tel:@@phoneValue">@@phone</a>
                @@if (phoneExtra) {<a class="contractor-card__link" href="tel:@@phoneExtraValue">@@phoneExtra</a>}
            </div>
        </div>
        @@if (telegram) {<div class="contractor-card__contact"><p class="contractor-card__label">Telegram:</p><a class="contractor-card__link" href="@@telegram" target="_blank" rel="noopener noreferrer">@@telegramText</a></div>}
    </div>
    <div class="contractor-card__details">
        @@if (hours) {<p class="contractor-card__hours">Время работы @@hours</p>}
        @@if (address) {<p class="contractor-card__address">Адрес: @@address</p>}
        <p class="contractor-card__price">@@price</p>
    </div>
</article>

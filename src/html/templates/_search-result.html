<div class="product-listing__item">
<article class="product product-tile product-tile--favorite">
    <div class="product-tile__visual">
        @@if(guarantee){<span class="product-tile__guarantee"><img src="@img/favorites/like.svg" alt="" class="product-tile__guarantee-icon" width="15" height="14">5 лет гарантии</span>}
        <div class="product-tile__actions">
            <button type="button" class="product-tile__action favorite-btn icon-heart" aria-pressed="false" aria-label="Добавить @@name в избранное"></button>
            <button type="button" class="product-tile__action compare-btn icon-bars" aria-label="Добавить @@name к сравнению" aria-pressed="false"></button>
        </div>
        @@include('_product-tile-gallery.html', {"image":"@@image", "name":"@@name"})
    </div>
    <div class="product-tile__meta"><span class="product-tile__text">Артикул: @@sku</span><span class="product-tile__rating"><img src="@img/favorites/star.svg" alt="" class="product-tile__rating-icon" width="14" height="14"><strong class="product-tile__rating-value">4.0</strong> (2180)</span></div>
    <a href="product.html" class="product__name product-tile__name">@@name</a>
    <div class="product-tile__price"><strong class="product-tile__value">@@price ₽</strong><del class="product-tile__old-price">@@oldPrice ₽</del>@@if(sale){<span class="product-tile__sale">-15%</span>}</div>
    <button type="button" class="product-tile__cart add-to-cart-btn"><img src="@img/favorites/cart.svg" alt="" class="product-tile__cart-icon" width="20" height="20">2 сентября</button>
</article>

</div>

<div class="review-sort">
    <label class="review-sort__label hidden" for="review-sort">Сортировка отзывов</label>
    <select data-custom-select class="review-sort__select" name="review-sort" id="review-sort">
        <option class="review-sort__option" value="helpful">Сначала полезные</option>
        <option class="review-sort__option" value="newest">Сначала новые</option>
        <option class="review-sort__option" value="highest">С высокой оценкой</option>
        <option class="review-sort__option" value="lowest">С низкой оценкой</option>
    </select>
    <span class="review-sort__icon icon-filter-horizontal" aria-hidden="true"></span>
</div>

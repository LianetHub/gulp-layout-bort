<div class="address-map">
    <h2 class="address-map__title title title-md" id="@@id-title">Выберите адрес на карте</h2>
    <div class="address-map__canvas" data-map-center="55.678,37.565"></div>
    <div class="address-map__selection">
        <input class="address-map__selected" type="text" name="map_address" placeholder="Выберите точку на карте" aria-label="Адрес" autocomplete="street-address">
        <button class="address-map__choose btn btn-primary" type="button">Выбрать</button>
    </div>
</div>

<div class="reviews">
    <h2 class="reviews__title title title-md">Отзывы о товаре</h2>
    <div class="reviews__body">
        <div class="reviews__main review-group">
            <div class="review-group__toolbar">@@include('./_review-sort.html')</div>
            <div class="reviews__list review-group__list">
                @@loop('../templates/_review.html', './html/json/product-reviews.json')
            </div>
            @@include('./_pagination.html')
        </div>
        <aside class="reviews__sidebar">
            <div class="rating-summary">
                <div class="rating-summary__main">
                    <strong class="rating-summary__score">4.8</strong>
                    <div class="rating-summary__info">
                        @@include('./_rating-stars.html', {"rating": "4.8"})
                        <p class="rating-summary__count">На основе 276 отзывов</p>
                    </div>
                </div>
                <div class="rating-summary__bars">
                    <div class="rating-summary__bar-row">
                        <span class="rating-summary__bar-label">5</span>
                        <div class="rating-summary__line-wrapper">
                            <div class="rating-summary__line" style="width: 89%"></div>
                        </div>
                        <span class="rating-summary__bar-label">246</span>
                    </div>
                    <div class="rating-summary__bar-row">
                        <span class="rating-summary__bar-label">4</span>
                        <div class="rating-summary__line-wrapper">
                            <div class="rating-summary__line" style="width: 6%"></div>
                        </div>
                        <span class="rating-summary__bar-label">16</span>
                    </div>
                    <div class="rating-summary__bar-row">
                        <span class="rating-summary__bar-label">3</span>
                        <div class="rating-summary__line-wrapper">
                            <div class="rating-summary__line" style="width: 3%"></div>
                        </div>
                        <span class="rating-summary__bar-label">8</span>
                    </div>
                    <div class="rating-summary__bar-row">
                        <span class="rating-summary__bar-label">2</span>
                        <div class="rating-summary__line-wrapper">
                            <div class="rating-summary__line" style="width: 1%"></div>
                        </div>
                        <span class="rating-summary__bar-label">3</span>
                    </div>
                    <div class="rating-summary__bar-row">
                        <span class="rating-summary__bar-label">1</span>
                        <div class="rating-summary__line-wrapper">
                            <div class="rating-summary__line" style="width: 1%"></div>
                        </div>
                        <span class="rating-summary__bar-label">3</span>
                    </div>
                </div>
                <a class="rating-summary__btn btn btn-primary" href="reviews.html">Написать отзыв</a>
            </div>
        </aside>
    </div>
</div>

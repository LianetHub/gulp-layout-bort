<dialog class="favorite-dialog" id="@@id" aria-labelledby="@@id-title" aria-describedby="@@id-message">
    <button type="button" class="favorite-dialog__close" data-dialog-close aria-label="Закрыть окно"><img src="@img/favorites/close.svg" alt="" class="favorite-dialog__icon" width="20" height="20"></button>
    <h2 class="favorite-dialog__title title title--form" id="@@id-title">@@title</h2>
    <p class="favorite-dialog__message" id="@@id-message">@@message</p>
    <div class="favorite-dialog__actions">
        <button type="button" class="favorite-dialog__confirm" data-dialog-confirm>Удалить</button>
        <button type="button" class="favorite-dialog__cancel" data-dialog-close autofocus>Отменить</button>
    </div>
</dialog>

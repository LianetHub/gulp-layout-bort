<form class="service__form form form--request" action="#" method="post" enctype="multipart/form-data" novalidate>
    <h2 class="service__form-heading title title-lg">Форма заявки на установку измельчителя</h2>
    <img class="service__form-image" src="@img/goods/shredder.png" alt="Измельчитель пищевых отходов Bort с комплектующими" loading="lazy">
    <div class="service__form-fields">
        <div class="form__field">
            <label class="form__label" for="installation-product">Имя</label>
            <input class="form__control" id="installation-product" type="text" name="name" placeholder="Имя" autocomplete="name" data-required required aria-describedby="installation-product-error">
            <div class="form__error-message" id="installation-product-error" aria-live="polite" hidden>Поле обязательно для заполнения</div>
        </div>
        <div class="form__field">
            <label class="form__label" for="installation-phone">Телефон</label>
            <input class="form__control" id="installation-phone" type="tel" name="phone" placeholder="+7 (___) ___-__-__" autocomplete="tel" inputmode="tel" data-required required aria-describedby="installation-phone-error">
            <div class="form__error-message" id="installation-phone-error" aria-live="polite" hidden>Введите корректный номер телефона</div>
        </div>
        <div class="form__field">
            <label class="form__label" for="installation-email">E-mail</label>
            <input class="form__control" id="installation-email" type="email" name="email" placeholder="E-mail" autocomplete="email" data-required required aria-describedby="installation-email-error">
            <div class="form__error-message" id="installation-email-error" aria-live="polite" hidden>Введите корректный e-mail</div>
        </div>
        <div class="form__field">
            <label class="form__label" for="installation-city">Город</label>
            <select data-custom-select data-has-search class="form__control form__control--select" id="installation-city" name="city" autocomplete="address-level2" data-required required aria-describedby="installation-city-error">
                <option class="form__option" value="" disabled selected>Выберите город</option>
                <option class="form__option" value="Москва">Москва и Московская область</option>
                <option class="form__option" value="Санкт-Петербург">Санкт-Петербург</option>
            </select>
            <div class="form__error-message" id="installation-city-error" aria-live="polite" hidden>Поле обязательно для заполнения</div>
        </div>
        @@include('_file-upload.html', {"id":"installation-files","multiple":true,"buttonText":"Загрузить файл"})
        <div class="form__field">
            <label class="form__label" for="installation-comment">Комментарий</label>
            <textarea class="form__control form__control--message" id="installation-comment" name="message" placeholder="Комментарий"></textarea>
        </div>
        <div class="form__field">
            <label class="checkbox checkbox--consent">
                <input class="checkbox__input hidden" type="checkbox" name="consent" value="1" data-required required aria-describedby="installation-consent-error">
                <span class="checkbox__btn">
                    <span class="checkbox__text">Настоящим подтверждаю, что я ознакомлен и согласен с условиями <a class="checkbox__link" href="policy.html" target="_blank" rel="noopener">Политики Конфиденциальности</a>
                    </span>
                </span>
            </label>
            <div class="form__error-message" id="installation-consent-error" aria-live="polite" hidden>Необходимо ваше согласие</div>
        </div>
        <button class="form__submit btn btn-primary" type="submit">Отправить</button>
    </div>
</form>

<div class="product-details__purchase-controls">
    <div class="product-details__price-row"><strong class="product-details__current">11 490 ₽</strong><del class="product-details__old">13 590 ₽</del><span class="product-details__discount">-15%</span></div>
    <div class="product-details__buy-row">
        <div class="product-details__quantity-control quantity-block quantity-block--outlined">
            <button class="quantity-block__down" type="button" aria-label="Уменьшить количество">−</button>
            <input class="quantity-block__input" type="number" name="quantity" value="1" min="1" max="9999" inputmode="numeric" aria-label="Количество товара">
            <button class="quantity-block__up" type="button" aria-label="Увеличить количество">+</button>
        </div>
        <button class="product-details__cart add-to-cart-btn icon-cart" type="button">В корзину</button>
    </div>
</div>

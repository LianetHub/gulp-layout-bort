<dialog class="confirmation-dialog" id="@@id" aria-labelledby="@@id-title" aria-describedby="@@id-message">
    <button type="button" class="confirmation-dialog__close" aria-label="Закрыть окно">
        <span class="confirmation-dialog__icon icon-close" aria-hidden="true"></span>
    </button>
    <h2 class="confirmation-dialog__title title title-md title-md--small title--sans" id="@@id-title">@@title</h2>
    <p class="confirmation-dialog__message" id="@@id-message">@@message</p>
    <div class="confirmation-dialog__actions">
        <button type="button" class="confirmation-dialog__confirm">@@if(typeof confirmLabel === 'undefined'){Удалить}@@if(typeof confirmLabel !== 'undefined'){@@confirmLabel}</button>
        <button type="button" class="confirmation-dialog__cancel" autofocus>@@if(typeof cancelLabel === 'undefined'){Отменить}@@if(typeof cancelLabel !== 'undefined'){@@cancelLabel}</button>
    </div>
</dialog>

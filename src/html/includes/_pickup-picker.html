<div role="dialog" class="address-picker address-picker--pickup" id="pickup-picker" aria-labelledby="pickup-picker-title">
    <button class="address-picker__close" type="button" data-fancybox-close aria-label="Закрыть">
        <span class="address-picker__close-icon icon-close" aria-hidden="true"></span>
    </button>
    <div class="address-picker__view address-picker__view--pickup" data-pickup-view="list">
        <form action="#" class="address-picker__pickup-form" novalidate>
            <div class="address-picker__pickup-content">
                <div class="address-picker__heading">
                    <h2 class="address-picker__title title title-sm" id="pickup-picker-title">Выберите пункт выдачи</h2>
                    <p class="address-picker__description">Найдите удобный пункт выдачи Озон.</p>
                </div>
                <div class="address-picker__toolbar">
                    <p class="address-picker__caption">Пункты выдачи</p>
                    <button class="address-picker__add" type="button">Добавить пункт выдачи</button>
                </div>
                <div class="address-picker__list">
                    @@loop('../templates/_pickup-point.html', './html/json/pickup-points.json')
                </div>
            </div>
            <div class="address-picker__actions">
                <button class="address-picker__button address-picker__button--primary" type="submit">Выбрать</button>
                <button class="address-picker__button" type="button" data-fancybox-close>Отменить</button>
            </div>
        </form>
    </div>
    <div class="address-picker__view" data-pickup-view="add" hidden>
        <div class="address-picker__heading">
            <h2 class="address-picker__title title title-sm" id="pickup-add-title">Добавить пункт</h2>
            <p class="address-picker__description">Заполните данные, чтобы использовать новый пункт выдачи</p>
        </div>
        <button class="address-picker__back" type="button">
            <span class="address-picker__back-icon icon-chevron-left" aria-hidden="true"></span>Назад к списку
        </button>
        <form action="#" class="address-picker__point-form" novalidate>
            <div class="address-picker__fields">
                <div class="address-picker__city">
                    <label class="form__field checkout__field">
                        <span class="checkout__label">Город</span>
                        <input class="checkout__input" name="city" placeholder="Город" autocomplete="address-level2" required data-required>
                        <span class="form__error-message" hidden aria-live="polite">Поле обязательно для заполнения</span>
                    </label>
                    <button class="address-picker__map-toggle" type="button" aria-expanded="false" aria-controls="pickup-add-map">
                        <span class="address-picker__map-icon icon-placemark-alternate" aria-hidden="true"></span>Выбрать на карте
                    </button>
                    <div class="address-picker__map" data-map-center="55.751244,37.618423" id="pickup-add-map" hidden></div>
                </div>
                <label class="form__field checkout__field">
                    <span class="checkout__label">Адрес пункта выдачи</span>
                    <input class="checkout__input" name="street" placeholder="Улица, номер дома" autocomplete="address-line1" required data-required>
                    <span class="form__error-message" hidden aria-live="polite">Поле обязательно для заполнения</span>
                </label>
            </div>
            <div class="address-picker__actions">
                <button class="address-picker__button address-picker__button--primary" type="submit">Добавить и выбрать</button>
                <button class="address-picker__button" type="button" data-fancybox-close>Отменить</button>
            </div>
        </form>
    </div>
</div>

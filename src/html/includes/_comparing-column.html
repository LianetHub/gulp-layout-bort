<div class="comparing__column" data-compare-column="@@column">
    <div class="comparing__swiper swiper">
        <div class="comparing__track swiper-wrapper">@@loop('../templates/_product-card-compare.html', './html/json/comparing-products.json')</div>
    </div>
    <div class="comparing__navigation">
        <button type="button" class="comparing__prev swiper-button-prev swiper-button-prev--square" aria-label="Предыдущий товар"></button>
        <div class="comparing__pagination swiper-pagination" aria-live="polite"></div>
        <button type="button" class="comparing__next swiper-button-next swiper-button-next--square" aria-label="Следующий товар"></button>
    </div>
</div>

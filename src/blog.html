<!DOCTYPE html>
<html lang="ru">
    @@include('html/_head.html', {
    'title': 'Новости'
    })
    <body>
        <div class="wrapper">
            @@include('html/_header.html', {
            "auth": false
            })
            <main class="page page--light">
                <nav aria-label="Хлебные крошки" class="breadcrumbs breadcrumbs--compact">
                    <div class="breadcrumbs__container container">
                        <ul class="breadcrumbs__list">
                            <li class="breadcrumbs__item">
                                <a href="/" class="breadcrumbs__link">Главная</a>
                            </li>
                            <li class="breadcrumbs__item">
                                <span class="breadcrumbs__link active" aria-current="page">Новости</span>
                            </li>
                        </ul>
                    </div>
                </nav>
                <section class="news news--listing">
                    <div class="news__container container">
                        <h1 class="news__title title title-lg">Новости</h1>
                        <ul class="news__grid">
                            @@loop('./html/templates/_news-card.html', './html/json/news-blog.json')
                        </ul>
                        <button type="button" class="news__btn load-more icon-loading">Показать еще</button>
                        <nav class="pagination pagination--subtle" aria-label="Страницы новостей">
                            <a href="blog.html" class="pagination__prev icon-chevron-left" aria-label="Предыдущая страница" aria-disabled="true" tabindex="-1"></a>
                            <a href="blog.html" class="pagination__item active" aria-current="page">1</a>
                            <a href="blog.html?page=2" class="pagination__item">2</a>
                            <a href="blog.html?page=3" class="pagination__item">3</a>
                            <span class="pagination__item">...</span>
                            <a href="blog.html?page=40" class="pagination__item">40</a>
                            <a href="blog.html?page=2" class="pagination__next icon-chevron-right" aria-label="Следующая страница"></a>
                        </nav>
                    </div>
                </section>
            </main>
            @@include('html/_footer.html', {})
            @@include('html/_js.html', {})
        </div>
    </body>
</html>

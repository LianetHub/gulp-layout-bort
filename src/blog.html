<!DOCTYPE html>
<html lang="ru">
    @@include('html/_head.html', {
    'title': 'Новости '
    })
    <body>
        <div class="wrapper">
            @@include('html/_header.html', {
            "auth": false
            })
            <main class="page">
                <nav aria-label="Хлебные крошки" class="breadcrumbs">
                    <div class="container">
                        <ul class="breadcrumbs__list">
                            <li class="breadcrumbs__item">
                                <a href="/" class="breadcrumbs__link">Главная</a>
                            </li>
                            <li class="breadcrumbs__item">
                                <span class="breadcrumbs__link active">Новости</a>
                            </li>
                        </ul>
                    </div>
                </nav>
                <section class="news">
                    <div class="container">
                        <h2 class="news__title title">новости</h2>
                        <div class="news__grid">
                            @@loop('./html/templates/_news-card.html', './html/json/news.json')
                        </div>
                        <a href="" class="news__btn btn btn-secondary icon-loading">Показать еще</a>
                        <div class="pagination">
                            <a href="" class="pagination__prev icon-chevron-left"></a>
                            <a href="" class="pagination__item active">1</a>
                            <a href="" class="pagination__item">2</a>
                            <a href="" class="pagination__item">3</a>
                            <a href="" class="pagination__item">4</a>
                            <span class="pagination__item">...</span>
                            <a href="" class="pagination__item">40</a>
                            <a href="" class="pagination__next icon-chevron-right"></a>
                        </div>
                    </div>
                </section>
            </main>
            @@include('html/_footer.html', {})
            @@include('html/_js.html', {})
        </div>
    </body>
</html>
